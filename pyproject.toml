# pyproject.toml

[build-system]
requires = [
    "setuptools",
    "wheel",
    "pybind11>=2.10.0",
    'numpy'
]
build-backend = "setuptools.build_meta"

[project]
name = "galapy-fit"
authors = [{ name = "Tommaso Ronconi", email = "tronconi@sissa.it" }]
readme = "README.rst"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
]
dynamic = ["version", "description"]
dependencies = [
    'numpy',
    'scipy',
    'tqdm',
    'emcee',
    'dynesty',
    'nautilus-sampler',
    'matplotlib>=3.6',
    'getdist',
    'requests',
    'h5py'
]
requires-python = ">=3.7"

[project.urls]
Source = "https://github.com/TommasoRonconi/galapy"
Documentation = "http://galapy.readthedocs.io/"

[project.optional-dependencies]
dev = ["bumpver", "pytest"]
test = ["pytest"]
doc = [
    "sphinx",
    "sphinx_rtd_theme",
    "jinja>=3.0.0",
    "nbsphinx",
    "graphviz"
]
#========== CLOUDIA ==========#
cloudia = [
    "numpy>=2.0",       #np.trapezoid
    "torch>=2.4",       #first with numpy2.0
    "gpytorch>=1.11",
    "scikit-learn>=1.3", #PCA
    "pyyaml>=6.0",
    "jinja2>=3.0"
]
cloudia-agent = [#WIP
    "ollama>=0.3",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7"
]

[project.scripts]
galapy-fit = "galapy.sampling.Run:_run"
galapy-genparams = "galapy.sampling.Run:_generate_parameter_file"
galapy-download-database = "galapy.internal.data:_entrypoint_download_database"
#========== CLOUDIA ==========# WIP tools
galapy-translate-filter = "galapy.CloudIA.cli.translate_filter:main"
galapy-agent            = "galapy.CloudIA.cli.agent:main"

[bumpver]
current_version = "v0.6.1"
version_pattern = "vMAJOR.MINOR.PATCH"
commit = true
tag = true
push = false
commit_message = "bump version to {new_version}\n\nNote: rename [Unreleased] to [{new_version}] in CHANGELOG.md before running bumpver."

[bumpver.file_patterns]
"galapy/__init__.py" = [
    "__version__ = '{version}'",
]
