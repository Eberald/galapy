# Author: Enrico Veraldi
# CloudIA — docs
#
# $  mkdocs serve -f mkdocs.yml -a localhost:9000       # local preview
# $  mkdocs build -f galapy/CloudIA/mkdocs.yml      # static build in site/
# $  mkdocs gh-deploy -f galapy/CloudIA/mkdocs.yml     # publication in github pages

site_name: "CloudIA — The spectroscopic module for GalaPy"
site_description: "The CLOUDY based spectroscopic module for GalaPy, via Machine Learning technique and AI enanched."
docs_dir: source
site_dir: site

theme:
  name: material
  logo: logo/CloudIA.png
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep orange
      toggle: { icon: material/weather-night, name: "Dark Theme" }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep orange
      toggle: { icon: material/weather-sunny, name: "Light Theme" }
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../../..]

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:      # $...$ and $$...$$ -> MathJax
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascript/mathjax.js
  - javascript/vendor/tex-mml-svg.js

nav:
  - Home: index.md
  - Guide:
      - Quickstart: quickstart.md
      - Command Line Interface:
          - "SSP extraction": ssp_extraction.md
          - "CLOUDY installation": cloudy_installation.md
      - "Integration with GalaPy": galapy_integration.md
      - "AI Agent - the AI part of CloudIA": ai_agent.md
      - "API CLOUDY": api_cloudy.md
  - Infrastructure:
      - "Container (Dockerfile)": container.md
      - "Pipeline Nextflow": pipeline.md
  - Physics:
      - "Physical Assumptions": physics_assumptions.md
      - "Routing η(τ)": eta_routing_explained.md
  - "Architecture Decision Record (ADR)": decisions.md